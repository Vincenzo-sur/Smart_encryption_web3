services:
  - type: web
    name: smart-encryption-web3-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
